<article class="document-card" [class.editing]="editing()">
  <header class="card-header">
    <span class="doc-id" [title]="docId()">{{ docId() }}</span>
    <span class="spacer"></span>
    @if (!editing()) {
    <button class="btn btn-ghost btn-sm" (click)="edit()">
      <i class="fa-solid fa-pen"></i>
      Edit
    </button>
    } @else if (isDirty()) {
    <span class="dirty-badge">Unsaved changes</span>
    }
  </header>

  @if (editing()) {
  <div class="editor-container" [style.height.px]="editorHeight()">
    <ngx-monaco-editor [options]="editorOptions" [(ngModel)]="editedJson"></ngx-monaco-editor>
  </div>
  @if (error()) {
  <div class="card-error">{{ error() }}</div>
  }
  <footer class="card-actions">
    <button class="btn btn-primary btn-sm" (click)="onSave()" [disabled]="isSaving() || !isDirty()">
      {{ isSaving() ? 'Saving…' : 'Save changes' }}
    </button>
    <button class="btn btn-ghost btn-sm" (click)="editing.set(false)" [disabled]="isSaving()">Cancel</button>
  </footer>
  } @else {
  <dl class="fields">
    @for (field of fields(); track field.key) {
    <dt>{{ field.key }}</dt>
    <dd [title]="field.value">{{ field.value }}</dd>
    <dd class="type">{{ field.type }}</dd>
    }
  </dl>
  @if (hiddenCount() > 0) {
  <button class="show-all" (click)="showAll.set(true)">Show {{ hiddenCount() }} more fields</button>
  }
  }
</article>
