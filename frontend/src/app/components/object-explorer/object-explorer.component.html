<div class="object-explorer" id="object-explorer-container">
    @if (isLoading()) {
    <div class="loading-state">
        <div class="loading-skeleton">
            <div class="skeleton-line skeleton"></div>
            <div class="skeleton-line short skeleton"></div>
            <div class="skeleton-line skeleton"></div>
            <div class="skeleton-line short skeleton"></div>
        </div>
    </div>
    } @else if (errorMessage()) {
    <div class="error-state">
        <i class="pi pi-exclamation-triangle"></i>
        <span>{{ errorMessage() }}</span>
    </div>
    } @else if (allTreeNodes().length > 0) {
    <!-- Search Box -->
    <div class="explorer-search">
        <svg class="search-icon" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor"
            stroke-width="2.5">
            <circle cx="11" cy="11" r="8"></circle>
            <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
        </svg>
        <input type="text" class="search-input" placeholder="Filter..." [ngModel]="searchQuery()"
            (ngModelChange)="searchQuery.set($event)" id="explorer-search-input" />
        @if (searchQuery()) {
        <button class="search-clear" (click)="clearSearch()" title="Clear search">
            <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3">
                <line x1="18" y1="6" x2="6" y2="18"></line>
                <line x1="6" y1="6" x2="18" y2="18"></line>
            </svg>
        </button>
        }
    </div>
    <p-tree [value]="treeNodes()" [loading]="false" [filter]="false" selectionMode="single"
        (onNodeExpand)="onNodeExpand($event)" (onNodeSelect)="onNodeSelect($event)" [scrollHeight]="'100%'"
        id="object-explorer-tree">
    </p-tree>
    @if (searchQuery() && treeNodes().length === 0) {
    <div class="no-results">
        <span>No results for "{{ searchQuery() }}"</span>
    </div>
    }
    } @else {
    <div class="empty-state">
        <span class="text-muted">No data loaded</span>
    </div>
    }
</div>
